# strings_fmt.yml — FM Towns (DARKNESS) Ultima I localized strings
# Encoding: UTF-8
#
# Each entry has two language keys:
#   en: English text  (original array[0])
#   ja: Japanese text (original array[1], SJIS-derived)
#
# Custom font glyphs (original 0xEB 0xNN two-byte sequences) are stored as
# Unicode PUA codepoints U+E000..U+E0FF.  The mapping is direct:
#   original byte pair  0xEB 0x1A  ->  U+E01A  (written \uE01A in YAML)
#
# The engine helper fmtUtf8ToSjis() converts these back to raw bytes at
# runtime before passing to the DARKNESS text renderer.
#
# Values marked "TODO" need the actual text filled in from the game binary.

common:
  header:
    en: "Ultima Trilogy I,II,III"
    ja: ""

intro:
  header:
    en: "Episode I : The First Age of Darkness" # decoded="Episode I : The First Age of Darkness"
    ja: ""
  slide1_1:
    en: "The first tale...."
    ja: "最初の物語・・・・" # decoded="最初の物語・・・・"
  slide1_2:
    en: "  Warm sunshine streams down from above, and the breeze is gentle and sweet."
    ja: "　暖かい日差しが降り注ぎ、風は穏やかだった。" # decoded="　暖かい日差しが降り注ぎ、風は穏やかだった。"
  slide1_3:
    en: "On the wind is carried the sound of a lute..."
    ja: "その風にのって、リュートの音が響いてくる・・・。" # decoded="その風にのって、リュートの音が響いてくる・・・。"
  slide1_4:
    en: "  You look to see a lone old bard seated in the shade of the trees on the outskirts of town, conversing quietly with several villagers."
    ja: "　見ると、村はずれの木陰に一人の年老いた吟遊詩人が座り、村人達に静かに語っていた。" # decoded="　見ると、村はずれの木陰に一人の年老いた吟遊詩人が座り、村人達に静かに語っていた。"
  slide1_5:
    en: "  You come closer, adding yourself to the circle of townsfolk."
    ja: "　君は近づき、村人の輪の中に加わった。" # decoded="　君は近づき、村人の輪の中に加わった。"
  slide1_6:
    en: "To the sound of his lute, in a soft voice, the bard begins to spin his tale."
    ja: "リュ−トの音色にあわせて、吟遊詩人が静かに語り始めた。" # decoded="リュ−トの音色にあわせて、吟遊詩人が静かに語り始めた。"
  slide2_1:
    en: "  This is the first of our tales. It took place in a time now long, long ago..."
    ja: "　初めの物語。それは、もう遠い昔の話・・・。" # decoded="　初めの物語。それは、もう遠い昔の話・・・。"
  slide2_2:
    en: "  In a time when this land was still called Sosaria... still fractured... still ruled by a number of feudal lords."
    ja: "　それは、まだこの土地が「ソーサリア」と呼ばれ、未だ統一されず、何人もの領主たちによって治められていた頃のこと。" # decoded="　それは、まだこの土地が「ソーサリア」と呼ばれ、未だ統一されず、何人もの領主たちによって治められていた頃のこと。"
  slide2_3:
    en: "  Our forefathers loved this land – tilled its earth; made their homes atop it; and died upon it."
    ja: "　我等の祖先はこの大地をこよなく愛し、耕し、生きて、そして死んでいった。" # decoded="　我等の祖先はこの大地をこよなく愛し、耕し、生きて、そして死んでいった。"
  slide2_4:
    en: "Many lived lives of peace; others, of strife."
    ja: "多くの者は幸せの中で、そして他の者は戦いの中で。" # decoded="多くの者は幸せの中で、そして他の者は戦いの中で。"
  slide2_5:
    en: "  Conflict between the rapacious feudal lords was constant, but for the most part, the days of peace remained unbroken."
    ja: "  欲深かな領主の間の争いは絶えなかったが、概ね平和な日々が続いていた。" # decoded="  欲深かな領主の間の争いは絶えなかったが、概ね平和な日々が続いていた。"
  slide2_6:
    en: "  But when did it all end..."
    ja: "  しかし、それはいつのことだったのだろう" # decoded="  しかし、それはいつのことだったのだろう"
  slide2_7:
    en: "...?" 
    ja: "・・・？" # decoded="・・・？"
  slide2_8:
    en: "  When did the hand of evil lash out at our beautiful land of Sosaria, so abundantly blessed, and rain down upon us calamity after calamity?"
    ja: "  恵み多き豊かな大地、美しき我がソーサリアの国に邪悪なる者の手により、災厄が降り注ぎ始めたのは・・・。" # decoded="  恵み多き豊かな大地、美しき我がソーサリアの国に邪悪なる者の手により、災厄が降り注ぎ始めたのは・・・。"
  slide3_1:
    en: "  As the people were assailed by endless catastrophe, horrible beasts ran rampant through Sosaria's villages, often leaving little but ruins in their wake."
    ja: "　度重なる災いにより、ソーサリアの村々は恐るべき怪物たちに踏みにじられ、その多くが廃墟と化してしまった。" # decoded="　度重なる災いにより、ソーサリアの村々は恐るべき怪物たちに踏みにじられ、その多くが廃墟と化してしまった。"
  slide3_2:
    en: "  These were all caused by the appearance of Mondain – the name we now have all come to despise."
    ja: "　それは、今なお忌まわしき名として知られる「モンデイン」の出現により引き起こされたものだったのだ。" # decoded="　それは、今なお忌まわしき名として知られる「モンデイン」の出現により引き起こされたものだったのだ。"
  slide3_2b:
    en: "The monsters he unleashed besieged the castles and burned the villages to the ground. The people fled their homes in panic, and the feudal lords cared only about protecting their own keeps."
    ja: "　モンデインの解き放した化物どもは、城を襲い、村を焼き払った。人々は逃げ惑い、領主たちは自らの城を守るのみであった。" # decoded="　モンデインの解き放した化物どもは、城を襲い、村を焼き払った。人々は逃げ惑い、領主たちは自らの城を守るのみであった。"
  slide3_3:
    en: "  Only one among them – a deeply wise young king by the name of"
    ja: "　しかし、その中でただ一人・・・若く英知に満ちた王、" # decoded="　しかし、その中でただ一人・・・若く英知に満ちた王、"
  slide3_4:
    en: "Lord British – dreamt of a Sosaria united as a peaceful realm..."
    ja: "「ロード・ブリティッシュ」は、ソーサリアの平和と統一を望んでいた・・・。" # decoded="「ロード・ブリティッシュ」は、ソーサリアの平和と統一を望んでいた・・・。"
  slide4_1:
    en: "  A hero was summoned by the king's own hand, and a hero answered his plea."
    ja: "　王の手により勇者が召喚され、勇者はその要請を受けた。" # decoded="　王の手により勇者が召喚され、勇者はその要請を受けた。"
  slide4_2:
    en: "The chosen one now set out on the king's quest – to vanquish the great evil of Mondain!"
    ja: "運命に選ばれたる勇者は、邪悪強大なるモンデインを倒さんと、今、旅立つ！" # decoded="運命に選ばれたる勇者は、邪悪強大なるモンデインを倒さんと、今、旅立つ！"

